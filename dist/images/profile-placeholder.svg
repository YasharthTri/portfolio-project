<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFE9D9" />
      <stop offset="100%" stop-color="#F7F3E8" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#173729" flood-opacity="0.12" />
    </filter>
  </defs>
  
  <!-- Outer Card Background -->
  <rect width="400" height="400" fill="url(#bgGrad)" rx="24" stroke="#D8D2C3" stroke-width="2"/>
  <circle cx="200" cy="180" r="145" stroke="#8A9B7A" stroke-width="1.5" stroke-dasharray="4,4" fill="none" opacity="0.6"/>
  
  <!-- Inner Monogram Circle in Forest Green -->
  <circle cx="200" cy="175" r="95" fill="#234B38" stroke="#D8D2C3" stroke-width="3" filter="url(#subtleShadow)" />
  
  <!-- Monogram Initials "SJ" in Warm Cream -->
  <text x="200" y="196" font-family="'Plus Jakarta Sans', Georgia, serif" font-size="62" font-weight="700" fill="#F7F3E8" text-anchor="middle" letter-spacing="2">
    SJ
  </text>
  
  <!-- Executive Badge in Sage / Forest Green -->
  <g transform="translate(105, 290)">
    <rect width="190" height="38" rx="19" fill="#173729" filter="url(#subtleShadow)"/>
    <text x="95" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#F7F3E8" text-anchor="middle" letter-spacing="1.5">
      MBA CANDIDATE
    </text>
  </g>
  
  <text x="200" y="360" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="500" fill="#687367" text-anchor="middle">
    Shashwat Joshi • Invertis University
  </text>
</svg>
