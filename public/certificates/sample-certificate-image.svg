<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="50%" stop-color="#1e3a5f" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="550" fill="url(#certBg)" rx="16" />
  
  <!-- Outer decorative border -->
  <rect x="25" y="25" width="750" height="500" rx="12" fill="none" stroke="url(#goldBorder)" stroke-width="8"/>
  <rect x="35" y="35" width="730" height="480" rx="8" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.8"/>
  
  <!-- Certificate Header -->
  <text x="400" y="110" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="4" fill="#0284c7" text-anchor="middle">CERTIFICATE OF ACHIEVEMENT</text>
  <line x1="300" y1="125" x2="500" y2="125" stroke="#0284c7" stroke-width="2" />
  
  <text x="400" y="175" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="800" fill="#0a192f" text-anchor="middle">Problem Solving &amp; Algorithmic Excellence</text>
  
  <text x="400" y="220" font-family="system-ui, sans-serif" font-size="16" fill="#64748b" text-anchor="middle">THIS IS PROUDLY PRESENTED TO</text>
  
  <!-- Recipient Name -->
  <text x="400" y="280" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="800" fill="#1e3a5f" text-anchor="middle">[YOUR NAME]</text>
  <line x1="220" y1="300" x2="580" y2="300" stroke="#cbd5e1" stroke-width="1" />
  
  <!-- Description -->
  <text x="400" y="340" font-family="system-ui, sans-serif" font-size="15" fill="#475569" text-anchor="middle">for successfully demonstrating proficiency in Data Structures, Problem Solving,</text>
  <text x="400" y="365" font-family="system-ui, sans-serif" font-size="15" fill="#475569" text-anchor="middle">and Algorithmic Complexity with outstanding performance.</text>
  
  <!-- Footer with Seal and Details -->
  <g transform="translate(140, 410)">
    <line x1="0" y1="40" x2="160" y2="40" stroke="#64748b" stroke-width="1.5" />
    <text x="80" y="60" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Issuing Authority</text>
    <text x="80" y="78" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Verified Organization</text>
  </g>
  
  <!-- Gold / Cyan Verification Seal -->
  <g transform="translate(400, 440)">
    <circle cx="0" cy="0" r="38" fill="#0f2744" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3"/>
    <path d="M -10 -2 L -3 6 L 12 -8" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="20" font-family="monospace, sans-serif" font-size="7" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="1">VERIFIED</text>
  </g>
  
  <g transform="translate(500, 410)">
    <line x1="0" y1="40" x2="160" y2="40" stroke="#64748b" stroke-width="1.5" />
    <text x="80" y="60" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Credential ID</text>
    <text x="80" y="78" font-family="monospace, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">CERT-VERIFY-2024</text>
  </g>
</svg>

